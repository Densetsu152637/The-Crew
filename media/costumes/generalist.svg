<svg xmlns="http://www.w3.org/2000/svg" width="136" height="136" viewBox="0 0 136 136" role="img" aria-label="generalist crab">
<title>generalist crab</title>
<style>
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}
.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
@keyframes blink{50%{opacity:0}}
.c-root.run .gem{animation:blink 1s steps(1) infinite}
.c-root.run .gem2{animation:blink 1s steps(1) infinite -.5s}
.c-root.run .spark{animation:blink .5s steps(1) infinite}
.c-manager.run .baton{transform-origin:50% 100%;animation:conduct .5s steps(1) infinite}
@keyframes conduct{50%{transform:rotate(-30deg)}}
.c-explorer.run .lan{transform-origin:50% 0;animation:swing 1s steps(1) infinite}
@keyframes swing{0%{transform:rotate(10deg)}50%{transform:rotate(-10deg)}}
.c-implementer.run .ham{transform-origin:50% 100%;animation:hammer .5s steps(1) infinite}
@keyframes hammer{50%{transform:rotate(-40deg)}}
.c-validator.run .ck{animation:blink .5s steps(1) infinite}
.c-critic.run .mono{animation:blink 1s steps(1) infinite -.5s}
.c-documenter.run .quill{transform-origin:0 100%;animation:write .5s steps(1) infinite}
@keyframes write{50%{transform:rotate(15deg)}}
.c-tester.run .bub{animation:rise .5s steps(2) infinite}
@keyframes rise{100%{transform:translateY(-2px);opacity:0}}
.c-researcher.run .pg{transform-origin:0 50%;animation:leaf 1s steps(1) infinite}
@keyframes leaf{50%{transform:scaleX(-1)}}
.c-debugger.run .net{transform-origin:50% 100%;animation:sweep .5s steps(1) infinite}
.c-debugger.run .bug{animation:buzz .25s steps(1) infinite}
@keyframes sweep{50%{transform:rotate(-25deg)}}@keyframes buzz{50%{transform:translate(1px,-1px)}}
.c-analyst.run .bars{transform-origin:50% 100%;animation:grow 1s steps(1) infinite}
@keyframes grow{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.c-architect.run .sq{transform-origin:0 100%;animation:measure 1s steps(1) infinite}
@keyframes measure{50%{transform:rotate(-15deg)}}
.c-auditor.run .glint{animation:blink .5s steps(1) infinite}
.c-navigator.run .cur{animation:click .5s steps(1) infinite}
.c-navigator.run .link{animation:blink .5s steps(1) infinite -.25s}
@keyframes click{50%{transform:translate(1px,1px)}}
.c-inspector.run .flash{animation:blink 1s steps(1) infinite}
.c-inspector.run .note{animation:rise 1s steps(4) infinite}
.c-generalist.run .blade{transform-origin:50% 100%;animation:sweep .5s steps(1) infinite}
.c-guide.run .flag{transform-origin:0 50%;animation:wave .5s steps(1) infinite}
@keyframes wave{50%{transform:scaleX(.5)}}
.c-statusline.run .roller{animation:roll 1s steps(2) infinite}
@keyframes roll{50%{transform:translateX(-4px)}}
@media (prefers-reduced-motion: reduce){.run,.run g{animation:none!important}}
</style>
<g transform="translate(8,16) scale(4)" opacity="1" shape-rendering="crispEdges"><g class="c-generalist run"><g class="bd"><path fill="#D97757" d="M7 10h16v12h-16zM3 14h4v4h-4zM23 10h4v4h-4z"/><path fill="#1F1E1D" d="M9 12h2v2h-2zM19 12h2v2h-2z"/><path fill="#F2B91F" d="M10 5h1v1h-1zM11 5h1v1h-1zM12 5h1v1h-1zM13 5h1v1h-1zM14 5h1v1h-1zM15 5h1v1h-1zM16 5h1v1h-1zM17 5h1v1h-1zM18 5h1v1h-1zM19 5h1v1h-1zM9 6h1v1h-1zM10 6h1v1h-1zM11 6h1v1h-1zM12 6h1v1h-1zM13 6h1v1h-1zM14 6h1v1h-1zM15 6h1v1h-1zM16 6h1v1h-1zM17 6h1v1h-1zM18 6h1v1h-1zM19 6h1v1h-1zM20 6h1v1h-1zM8 7h1v1h-1zM9 7h1v1h-1zM10 7h1v1h-1zM11 7h1v1h-1zM12 7h1v1h-1zM13 7h1v1h-1zM14 7h1v1h-1zM15 7h1v1h-1zM16 7h1v1h-1zM17 7h1v1h-1zM18 7h1v1h-1zM19 7h1v1h-1zM20 7h1v1h-1zM21 7h1v1h-1z"/><path fill="#B8881A" d="M8 8h1v1h-1zM9 8h1v1h-1zM10 8h1v1h-1zM11 8h1v1h-1zM12 8h1v1h-1zM13 8h1v1h-1zM14 8h1v1h-1zM15 8h1v1h-1zM16 8h1v1h-1zM17 8h1v1h-1zM18 8h1v1h-1zM19 8h1v1h-1zM20 8h1v1h-1zM21 8h1v1h-1zM8 9h1v1h-1zM9 9h1v1h-1zM10 9h1v1h-1zM11 9h1v1h-1zM12 9h1v1h-1zM13 9h1v1h-1zM14 9h1v1h-1zM15 9h1v1h-1zM16 9h1v1h-1zM17 9h1v1h-1zM18 9h1v1h-1zM19 9h1v1h-1zM20 9h1v1h-1zM21 9h1v1h-1z"/><path fill="#FFFFFF" d="M11 6h2v1h-2z"/><path fill="#C4C9D2" d="M26 2h1v1h-1z"/><path fill="#7D838F" d="M27 2h1v1h-1z"/><path fill="#C4C9D2" d="M26 3h1v1h-1z"/><path fill="#7D838F" d="M27 3h1v1h-1z"/><path fill="#C4C9D2" d="M26 4h1v1h-1z"/><path fill="#7D838F" d="M27 4h1v1h-1z"/><path fill="#C4C9D2" d="M26 5h1v1h-1z"/><path fill="#7D838F" d="M27 5h1v1h-1z"/><path fill="#C4C9D2" d="M26 6h1v1h-1z"/><path fill="#7D838F" d="M27 6h1v1h-1zM29 4h1v1h-1zM29 5h1v1h-1zM29 6h1v1h-1z"/><path fill="#D52B1E" d="M22 7h1v1h-1zM23 7h1v1h-1zM24 7h1v1h-1zM25 7h1v1h-1zM26 7h1v1h-1zM27 7h1v1h-1zM28 7h1v1h-1zM29 7h1v1h-1zM22 8h1v1h-1z"/><path fill="#FFFFFF" d="M23 8h1v1h-1z"/><path fill="#D52B1E" d="M24 8h1v1h-1zM25 8h1v1h-1zM26 8h1v1h-1zM27 8h1v1h-1zM28 8h1v1h-1zM29 8h1v1h-1z"/><path fill="#FFFFFF" d="M22 9h1v1h-1zM23 9h1v1h-1zM24 9h1v1h-1z"/><path fill="#D52B1E" d="M25 9h1v1h-1zM26 9h1v1h-1zM27 9h1v1h-1zM28 9h1v1h-1zM29 9h1v1h-1zM22 10h1v1h-1z"/><path fill="#FFFFFF" d="M23 10h1v1h-1z"/><path fill="#D52B1E" d="M24 10h1v1h-1zM25 10h1v1h-1zM26 10h1v1h-1zM27 10h1v1h-1zM28 10h1v1h-1zM29 10h1v1h-1z"/><path fill="#8F1A12" d="M22 11h1v1h-1zM23 11h1v1h-1zM24 11h1v1h-1zM25 11h1v1h-1zM26 11h1v1h-1zM27 11h1v1h-1zM28 11h1v1h-1zM29 11h1v1h-1z"/><g class="blade"><path fill="#C4C9D2" d="M23 0h1v1h-1z"/><path fill="#7D838F" d="M24 0h1v1h-1z"/><path fill="#C4C9D2" d="M23 1h1v1h-1z"/><path fill="#7D838F" d="M24 1h1v1h-1z"/><path fill="#C4C9D2" d="M23 2h1v1h-1z"/><path fill="#7D838F" d="M24 2h1v1h-1z"/><path fill="#C4C9D2" d="M23 3h1v1h-1z"/><path fill="#7D838F" d="M24 3h1v1h-1z"/><path fill="#C4C9D2" d="M23 4h1v1h-1z"/><path fill="#7D838F" d="M24 4h1v1h-1z"/><path fill="#C4C9D2" d="M23 5h1v1h-1z"/><path fill="#7D838F" d="M24 5h1v1h-1z"/><path fill="#C4C9D2" d="M23 6h1v1h-1z"/><path fill="#7D838F" d="M24 6h1v1h-1z"/><path fill="#FFFFFF" d="M23 0h1v1h-1z"/></g></g><g class="la"><path fill="#D97757" d="M7 22h2v4h-2zM17 22h2v4h-2z"/></g><g class="lb"><path fill="#D97757" d="M11 22h2v4h-2zM21 22h2v4h-2z"/></g></g></g>
</svg>
